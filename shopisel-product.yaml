openapi: 3.0.0
info:
  title: Shopisel API Product Service
  version: 1.0.0
  description: Pedidos relacionados com categorias e produtos.

servers:
  - url: http://localhost:5000

paths:
  /categories:
    get:
      summary: Obter todas as categorias
      tags: [Category]
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      summary: Criar categoria
      tags: [Category]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'

  /categories/main:
    get:
      summary: Obter categorias principais
      tags: [Category]
      responses:
        '200':
          description: Lista de categorias principais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'

  /categories/{categoryId}/subcategories:
    get:
      summary: Obter subcategorias de uma categoria
      tags: [Category]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de subcategorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Categoria nao encontrada

  /categories/{categoryId}:
    put:
      summary: Atualizar categoria
      tags: [Category]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Categoria nao encontrada
    delete:
      summary: Apagar categoria
      tags: [Category]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Categoria removida
        '404':
          description: Categoria nao encontrada
        '409':
          description: Categoria com produtos associados ou subcategorias

  /products:
    get:
      summary: Obter produtos por query
      tags: [Product]
      parameters:
        - name: ids
          in: query
          description: IDs separados por virgula
          required: false
          schema:
            type: string
            example: prod_1,prod_2
        - name: categoryId
          in: query
          description: ID da categoria
          required: false
          schema:
            type: string
            example: cat_food
        - name: name
          in: query
          description: Termo de pesquisa por nome
          required: false
          schema:
            type: string
            example: leite
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Filtros invalidos ou em falta
    post:
      summary: Criar produto
      tags: [Product]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'

  /products/qrCode:
    post:
      summary: Lookup de produto por QRCode (barcode + keywords)
      description: >
        Tenta identificar um produto com base no barcode e/ou keywords (nome, marca, etc).
        Se encontrar match perfeito devolve o produto (matchType=exact). Caso contrário devolve sugestões relacionadas (matchType=related).
      tags: [Product]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrCodeLookupRequest'
            examples:
              barcode:
                summary: Match por barcode
                value:
                  barcode: "560123"
                  keywords: []
              keywords:
                summary: Match por keywords
                value:
                  barcode: ""
                  keywords: ["agua", "caramulo", "nascente", "ponto", "verde"]
      responses:
        '200':
          description: Resultado do lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodeLookupResponse'
        '400':
          description: Pedido inválido (sem barcode e sem keywords úteis)

  /products/{productId}:
    put:
      summary: Atualizar produto
      tags: [Product]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Produto nao encontrado
    delete:
      summary: Apagar produto
      tags: [Product]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Produto removido
        '404':
          description: Produto nao encontrado

components:
  schemas:
    CategoryResponse:
      type: object
      required: [id, name, image]
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        parentCategoryId:
          type: string
          nullable: true
    CreateCategoryRequest:
      type: object
      required: [name, image]
      properties:
        name:
          type: string
        image:
          type: string
        parentCategoryId:
          type: string
          nullable: true
    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        image:
          type: string
        parentCategoryId:
          type: string
          nullable: true
    ProductResponse:
      type: object
      required: [id, name, barcode, categoryId, image]
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: string
          nullable: true
        barcode:
          type: string
        categoryId:
          type: string
        image:
          type: string
    CreateProductRequest:
      type: object
      required: [name, barcode, categoryId]
      properties:
        name:
          type: string
        brand:
          type: string
          nullable: true
        barcode:
          type: string
        categoryId:
          type: string
        image:
          type: string
          nullable: true
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        brand:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        image:
          type: string
          nullable: true

    QrCodeLookupRequest:
      type: object
      required: [barcode, keywords]
      properties:
        barcode:
          type: string
          description: Barcode do produto (pode ser string vazia; é obrigatório enviar pelo menos barcode ou keywords)
          example: "560123"
        keywords:
          type: array
          description: Lista de tokens/keywords (nome, marca, etc)
          items:
            type: string
          example: ["agua", "caramulo", "nascente"]

    QrCodeLookupResponse:
      type: object
      required: [matchType, product, relatedProducts]
      properties:
        matchType:
          type: string
          description: Tipo de match encontrado
          enum: [exact, related, none]
        product:
          $ref: '#/components/schemas/ProductResponse'
          nullable: true
        relatedProducts:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
